name: CI & Reproducible Builds

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Test & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Test build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" .

  build-reproducible-binaries:
    name: Build Reproducible Binary (Linux x64)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          check-latest: true

      - name: Compile Linux x86_64 binary
        run: |
          mkdir -p dist
          COMMIT=$(git rev-parse HEAD)
          BUILD_TIME=$(git log -1 --format=%cI)
          REPO="https://github.com/${{ github.repository }}"
          LDFLAGS="-s -w -buildid= -X ye-userinfo-bot/pkg/bot.GitCommit=${COMMIT} -X ye-userinfo-bot/pkg/bot.BuildTime=${BUILD_TIME} -X ye-userinfo-bot/pkg/bot.RepoURL=${REPO}"

          # Linux x86_64 (amd64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/ye-userinfo-bot-linux-amd64 .

          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ye-userinfo-bot-linux-amd64
          path: dist/

      # 1. Rolling Release on every commit merged to master (Native GitHub CLI)
      - name: Publish Rolling Latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest dist/* \
            --title "Latest Automated Build" \
            --notes "### 🤖 Automated Reproducible Build for \`master\`
          - **Commit:** \`${{ github.sha }}\`
          - **Branch:** \`master\`
          - **Transparency:** Check \`checksums.txt\` to verify SHA-256 binary integrity against \`/about\` in the bot." \
            --generate-notes \
            --clobber

      # 2. Tagged Release on version tags (Native GitHub CLI)
      - name: Publish Tagged Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG_NAME" dist/* \
            --title "$TAG_NAME" \
            --generate-notes \
            --clobber
